services:
  db:
    image: postgres:16-alpine
    container_name: tp2_postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tp2_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - tp2_pgdata:/var/lib/postgresql/data
volumes:
  tp2_pgdata:
